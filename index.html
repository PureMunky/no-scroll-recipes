<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Scroll Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f1; --card:#ffffff; --ink:#2b2420; --muted:#7a6d64; --line:#ece3d8;
    --accent:#c4552d; --accent-soft:#f6e3d9; --green:#4f7a4a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1715; --card:#24201d; --ink:#f2ebe4; --muted:#a99c92; --line:#3a332e; --accent:#e47a52; --accent-soft:#3a2a22; --green:#8fb889; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px}
  header{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
  header .wrap{display:flex;align-items:center;gap:12px;height:60px}
  .brand{font-family:Fraunces,serif;font-weight:700;font-size:22px;text-decoration:none;letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .spacer{flex:1}
  .btn{border:0;border-radius:999px;padding:9px 16px;font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .hero{padding:34px 0 10px}
  .hero h1{font-family:Fraunces,serif;font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 8px}
  .hero p{color:var(--muted);margin:0 0 20px;max-width:560px}
  .promise{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
  .search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px Inter,sans-serif}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
  .tag{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px Inter,sans-serif;cursor:pointer}
  .tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .emoji{font-size:30px}
  .card h3{font-family:Fraunces,serif;margin:4px 0 0;font-size:19px;line-height:1.2}
  .meta{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);padding:30px 0;text-align:center}

  /* recipe view */
  .recipe{padding:24px 0 40px}
  .back{color:var(--muted);text-decoration:none;font-size:14px}
  .recipe h1{font-family:Fraunces,serif;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:10px 0 6px}
  .facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:6px 0 20px}
  .facts b{color:var(--ink)}
  .cols{display:grid;grid-template-columns:minmax(240px,1fr) 1.5fr;gap:22px}
  @media (max-width:700px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .panel h2{font-family:Fraunces,serif;font-size:20px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
  .scale{display:flex;align-items:center;gap:8px;font:500 14px Inter,sans-serif}
  .scale button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
  ul.ing{list-style:none;margin:0;padding:0}
  ul.ing li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;cursor:pointer}
  ul.ing li:last-child{border-bottom:0}
  ul.ing li .box{flex:0 0 18px;height:18px;border:2px solid var(--line);border-radius:5px;margin-top:3px}
  ul.ing li.done{color:var(--muted);text-decoration:line-through}
  ul.ing li.done .box{background:var(--green);border-color:var(--green)}
  .qty{font-weight:600}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;padding:10px 0 10px 42px;position:relative;border-bottom:1px dashed var(--line);cursor:pointer}
  ol.steps li:last-child{border-bottom:0}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:14px}
  ol.steps li.done{color:var(--muted)}
  ol.steps li.done::before{content:"✓";background:var(--green);color:#fff}
  .hint{color:var(--muted);font-size:12px;margin-top:10px}
  .note{margin-top:18px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:15px}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

  /* donate */
  .donate{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin:10px 0 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
  @media (max-width:700px){.donate{grid-template-columns:1fr}}
  .donate h2{font-family:Fraunces,serif;margin:0 0 6px;font-size:24px}
  .donate p{margin:0;color:var(--muted)}
  .amounts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .amt{flex:1;min-width:60px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 0;font:600 16px Inter,sans-serif;cursor:pointer}
  .amt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .donate .btn{width:100%;justify-content:center;padding:13px}
  .fine{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
  .inline-donate{margin-top:22px;text-align:center;color:var(--muted);font-size:14px}
  .inline-donate a{color:var(--accent);font-weight:600}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#">No Scroll <span>Recipes</span></a>
    <div class="spacer"></div>
    <a class="btn btn-accent" href="#support">♥ Support</a>
  </div>
</header>

<main class="wrap" id="app"></main>

<section class="wrap" id="support">
  <div class="donate">
    <div>
      <h2>Keep it ad-free</h2>
      <p>No ads, no pop-ups, no life story before the ingredients. If a recipe here saved your dinner, a small tip covers hosting and keeps it that way.</p>
    </div>
    <div>
      <div class="amounts" id="amounts"></div>
      <a class="btn btn-accent" id="donateBtn" href="#" target="_blank" rel="noopener">Tip $5</a>
      <div class="fine" id="donateFine"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">No Scroll Recipes · No ads, no tracking, no newsletter pop-ups. Supported by readers.</div>
</footer>
<div class="toast" id="toast"></div>

<script src="recipes.js"></script>
<script>
/* ===== Config: point this at your donation page (Ko-fi, Buy Me a Coffee, GitHub Sponsors, Stripe Payment Link…) ===== */
const DONATE = {
  url: "https://ko-fi.com/YOUR-PAGE",   // replace with your real link
  label: "Ko-fi",
  amounts: [3, 5, 10, 25]
};

const RECIPES = (window.RECIPES || []).map(r => ({...r, tags: r.time <= 30 && !r.tags.includes("Quick") ? [...r.tags, "Quick"] : r.tags}));
const TAG_ORDER = ["Breakfast","Lunch","Dinner","Soup","Side","Dessert","Snack","Quick","Vegetarian","Gluten-free","Kid-friendly","Make-ahead","Baking"];
function fmtTime(m){ if(m < 60) return m + " min"; const h = Math.floor(m/60), r = m % 60; return h + " hr" + (r ? " " + r + " min" : ""); }

const $ = s => document.querySelector(s);
const app = $("#app");
let activeTag = "All", query = "";
const allTags = ["All", ...[...new Set(RECIPES.flatMap(r => r.tags))].sort((a,b)=>{const ia=TAG_ORDER.indexOf(a), ib=TAG_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);})];

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

function fmtQty(n){
  if(!n) return "";
  const whole = Math.floor(n), frac = n - whole;
  const map = [[0,""],[.125,"⅛"],[.25,"¼"],[.333,"⅓"],[.5,"½"],[.667,"⅔"],[.75,"¾"],[1,""]];
  let best = map[0]; for(const m of map) if(Math.abs(frac-m[0]) < Math.abs(frac-best[0])) best = m;
  const w = best[0]===1 ? whole+1 : whole;
  if(n >= 10) return String(Math.round(n));
  return ((w ? w : "") + best[1]) || "0";
}
function unitLabel(u, n){
  if(!u) return "";
  if(u==="pinch") return n>1?"pinches":"pinch";
  if(["cup","can","pint"].includes(u) && n>1) return u+"s";
  return u;
}

function renderHome(){
  document.title = "No Scroll Recipes";
  const q = query.toLowerCase();
  const list = RECIPES.filter(r =>
    (activeTag==="All" || r.tags.includes(activeTag)) &&
    (!q || r.title.toLowerCase().includes(q) || r.ing.some(i => i[2].toLowerCase().includes(q))));
  app.innerHTML = `
    <section class="hero">
      <h1>The recipe. Right away.</h1>
      <p>${RECIPES.length} recipes. Tap one and you land on the ingredients and steps. That's the whole site.</p>
      <div class="promise"><span class="pill">No ads</span><span class="pill">No life stories</span><span class="pill">No pop-ups</span><span class="pill">Reader-supported</span></div>
      <input class="search" id="q" placeholder="Search recipes or ingredients — try “garlic”" value="${query.replace(/"/g,"&quot;")}">
      <div class="tags">${allTags.map(t=>`<button class="tag ${t===activeTag?"on":""}" data-tag="${t}">${t}</button>`).join("")}</div>
    </section>
    <section class="grid">
      ${list.map(r=>`<a class="card" href="#${r.id}">
          <div class="emoji">${r.emoji}</div>
          <h3>${r.title}</h3>
          <div class="meta">${fmtTime(r.time)} · serves ${r.serves} · ${r.tags.join(", ")}</div>
        </a>`).join("") || `<div class="empty">No recipes match that. Try another word.</div>`}
    </section>`;
  const qi = $("#q");
  qi.addEventListener("input", e => { query = e.target.value; const pos = e.target.selectionStart; renderHome(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  app.querySelectorAll(".tag").forEach(b => b.onclick = () => { activeTag = b.dataset.tag; renderHome(); });
}

function renderRecipe(r){
  document.title = r.title + " · No Scroll Recipes";
  const key = "jtr-"+r.id;
  const state = store(key) || { serves:r.serves, ing:[], steps:[] };
  const draw = () => {
    const f = state.serves / r.serves;
    app.innerHTML = `
    <article class="recipe">
      <a class="back" href="#">← All recipes</a>
      <h1>${r.emoji} ${r.title}</h1>
      <div class="facts"><span><b>${fmtTime(r.time)}</b></span><span><b>${r.ing.length}</b> ingredients</span><span>${r.tags.join(" · ")}</span></div>
      <div class="cols">
        <div class="panel">
          <h2>Ingredients
            <span class="scale"><button id="minus" aria-label="Fewer servings">−</button>${state.serves}<button id="plus" aria-label="More servings">+</button></span>
          </h2>
          <ul class="ing">${r.ing.map((i,ix)=>{const n=i[0]*f;return `<li data-i="${ix}" class="${state.ing.includes(ix)?"done":""}"><span class="box"></span><span><span class="qty">${fmtQty(n)} ${unitLabel(i[1],n)}</span> ${i[2]}</span></li>`}).join("")}</ul>
          <div class="hint">Tap to check off · servings adjust amounts</div>
        </div>
        <div class="panel">
          <h2>Steps</h2>
          <ol class="steps">${r.steps.map((s,ix)=>`<li data-s="${ix}" class="${state.steps.includes(ix)?"done":""}">${s}</li>`).join("")}</ol>
          ${r.note?`<div class="note"><b>Tip:</b> ${r.note}</div>`:""}
          <div class="actions">
            <button class="btn btn-ghost" id="copy">Copy recipe</button>
            <button class="btn btn-ghost" id="reset">Reset checkmarks</button>
          </div>
        </div>
      </div>
      <div class="inline-donate">Made this tonight? <a href="#support">Chip in a few bucks</a> to keep the site ad-free.</div>
    </article>`;
    const save = () => store(key, state);
    $("#minus").onclick = () => { if(state.serves>1){state.serves--;save();draw();} };
    $("#plus").onclick = () => { state.serves++;save();draw(); };
    app.querySelectorAll("[data-i]").forEach(li=>li.onclick=()=>{const i=+li.dataset.i;state.ing=state.ing.includes(i)?state.ing.filter(x=>x!==i):[...state.ing,i];save();draw();});
    app.querySelectorAll("[data-s]").forEach(li=>li.onclick=()=>{const i=+li.dataset.s;state.steps=state.steps.includes(i)?state.steps.filter(x=>x!==i):[...state.steps,i];save();draw();});
    $("#reset").onclick = () => { state.ing=[];state.steps=[];save();draw(); };
    $("#copy").onclick = async () => {
      const f2 = state.serves / r.serves;
      const txt = `${r.title} (serves ${state.serves})\n\nIngredients\n` + r.ing.map(i=>`- ${fmtQty(i[0]*f2)} ${unitLabel(i[1],i[0]*f2)} ${i[2]}`.replace(/\s+/g," ")).join("\n") + `\n\nSteps\n` + r.steps.map((s,ix)=>`${ix+1}. ${s}`).join("\n");
      try{ await navigator.clipboard.writeText(txt); toast("Recipe copied"); }catch(e){ toast("Couldn't copy here"); }
    };
  };
  draw();
  window.scrollTo(0,0);
}

function route(){
  const id = location.hash.slice(1);
  if(id === "support"){ if(!app.innerHTML) renderHome(); $("#support").scrollIntoView({behavior:"smooth"}); return; }
  const r = RECIPES.find(x => x.id === id);
  r ? renderRecipe(r) : renderHome();
}

/* donation widget */
let amount = DONATE.amounts[1];
function drawDonate(){
  $("#amounts").innerHTML = DONATE.amounts.map(a=>`<button class="amt ${a===amount?"on":""}" data-a="${a}">$${a}</button>`).join("");
  $("#amounts").querySelectorAll(".amt").forEach(b=>b.onclick=()=>{amount=+b.dataset.a;drawDonate();});
  const btn = $("#donateBtn");
  btn.textContent = `Tip $${amount} via ${DONATE.label}`;
  btn.href = DONATE.url;
  $("#donateFine").textContent = `Opens ${DONATE.label} in a new tab · ${DONATE.url.replace(/^https?:\/\//,"")}`;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

drawDonate();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
